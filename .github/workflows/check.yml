name: Check and build
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: CS2-Assistant-Windows
          path: release/*.exe
